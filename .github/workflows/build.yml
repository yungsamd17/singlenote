name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege by default: the `build` job only reads the repo.
# The tag-only `release` job below escalates to `contents: write` —
# the minimum softprops/action-gh-release needs to create the GitHub
# Release and upload assets (plus attestations/id-token for build
# provenance). Keeping write off the build job limits what a compromised
# build step could do.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Lets the tag-only `release` job skip when forks build tags
      # without secrets (no signed APKs to publish — stays green).
      has-signing: ${{ steps.signing.outputs.has-signing }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the filter below diffs the PR against its base.
          fetch-depth: 0

      # Docs-only PRs (*.md, docs/, LICENSE) skip the app build below but
      # the job still succeeds, so the required `build` check stays green.
      # Pushes and tags always build: main merges re-verify the tree and
      # tags must produce release APKs.
      - name: Detect app changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- \
            | grep -v -e '\.md$' -e '^docs/' -e '^LICENSE$' -e '^THIRD_PARTY_LICENSES$' || true)
          if [ -z "$changed" ]; then
            echo "Docs-only change; skipping app build."
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

      # Supply chain: reject a tampered Gradle wrapper before running it.
      - name: Validate Gradle wrapper
        if: steps.filter.outputs.app == 'true'
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3

      - name: Set up JDK 17
        if: steps.filter.outputs.app == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.filter.outputs.app == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        if: steps.filter.outputs.app == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # v3 default (tools + platform-tools) breaks: the obsolete
          # `tools` package was removed from the SDK repo, so sdkmanager
          # exits 1 with "Failed to find package 'tools'". The runner
          # already ships platform-tools; Gradle fetches the rest.
          packages: ''

      - name: Set up debug keystore
        if: steps.filter.outputs.app == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android ~/.config/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.config/.android/debug.keystore
            cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.config/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
          fi

      # Fork PRs receive no secrets: detect signing ability once and let
      # every release-only step key off it, so forks stay green on the
      # debug-only path below. Upstream (and tags) always have secrets.
      - name: Detect release signing
        id: signing
        if: steps.filter.outputs.app == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "has-signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release secrets; building debug only."
            echo "has-signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up release keystore
        if: steps.filter.outputs.app == 'true' && steps.signing.outputs.has-signing == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          {
            echo "RELEASE_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build, test, lint
        if: steps.filter.outputs.app == 'true' && steps.signing.outputs.has-signing == 'true'
        run: ./gradlew --no-daemon clean assembleDebug assembleRelease testDebugUnitTest lintDebug lintRelease

      # Unsigned fallback for forks: same checks minus assembleRelease,
      # which would fail at signing time without the release keystore.
      # lintRelease needs no keystore, so the plan's demand still holds.
      - name: Build, test, lint (debug only)
        if: steps.filter.outputs.app == 'true' && steps.signing.outputs.has-signing != 'true'
        run: ./gradlew --no-daemon clean assembleDebug testDebugUnitTest lintDebug lintRelease

      - name: Upload debug APK artifact
        if: steps.filter.outputs.app == 'true' && github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: singlenote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Tag builds hand versioned APKs + checksums to the `release` job
      # instead of publishing from here, so this job needs no write scope.
      - name: Name APKs and checksums for release job
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.has-signing == 'true'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "singlenote-${{ github.ref_name }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "singlenote-${{ github.ref_name }}-release.apk"
          sha256sum "singlenote-${{ github.ref_name }}-debug.apk" > "singlenote-${{ github.ref_name }}-debug.apk.sha256"
          sha256sum "singlenote-${{ github.ref_name }}-release.apk" > "singlenote-${{ github.ref_name }}-release.apk.sha256"
          # v1.0.0 plan: log the release hash in the workflow output.
          sha256sum "singlenote-${{ github.ref_name }}-debug.apk" "singlenote-${{ github.ref_name }}-release.apk"

      - name: Upload APKs for release job
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.has-signing == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: singlenote-apks
          path: |
            singlenote-${{ github.ref_name }}-debug.apk
            singlenote-${{ github.ref_name }}-debug.apk.sha256
            singlenote-${{ github.ref_name }}-release.apk
            singlenote-${{ github.ref_name }}-release.apk.sha256

  release:
    # Tags only — and only with signing secrets, so a fork's own tags
    # skip instead of failing on APKs that were never signed.
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.has-signing == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Minimum for softprops/action-gh-release: create the Release and
      # upload assets. attestations/id-token feed build provenance below.
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download APKs from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: singlenote-apks
          path: dist

      # Sideloaded APKs get Sigstore build provenance, verifiable from
      # the release page. Runs here (not on forks) so it can't break them.
      - name: Attest APK provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/singlenote-${{ github.ref_name }}-debug.apk
            dist/singlenote-${{ github.ref_name }}-release.apk

      - name: Release APKs on tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Versioned names (e.g. singlenote-v0.3.3-release.apk) so assets
          # are identifiable without opening the release; the .sha256
          # files let sideloaders verify with `sha256sum -c`.
          files: |
            dist/singlenote-${{ github.ref_name }}-debug.apk
            dist/singlenote-${{ github.ref_name }}-debug.apk.sha256
            dist/singlenote-${{ github.ref_name }}-release.apk
            dist/singlenote-${{ github.ref_name }}-release.apk.sha256
          generate_release_notes: true
