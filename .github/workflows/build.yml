name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build, test, lint
        run: ./gradlew --no-daemon clean assembleDebug assembleRelease testDebugUnitTest lintDebug

      - name: Keystore diagnostics (temporary)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "secret length: ${#DEBUG_KEYSTORE_BASE64}"
          echo "--- all debug.keystore files on runner:"
          find / -name 'debug.keystore' 2>/dev/null | while read -r f; do sha256sum "$f"; done
          echo "--- decoded file at ~/.android:"
          sha256sum ~/.android/debug.keystore 2>/dev/null
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -E 'Alias name|SHA256: ' | head -4
          echo "--- cert actually in built release APK:"
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | grep -E 'SHA-256' | head -2

      - name: Upload debug APK artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: singlenote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APKs on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
