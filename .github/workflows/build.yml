name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Batch merges: only the latest main build runs to completion — an
# earlier one still in flight when the next PR lands is cancelled, and
# the survivor covers the whole batch. PRs, tags, and dispatches never
# cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

# App validation needs read access only. Release publishing lives in release.yml.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Lets the tag-only `release` job skip when forks build tags
      # without secrets (no signed APKs to publish — stays green).
      has-signing: ${{ steps.signing.outputs.has-signing }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the filter below diffs the PR against its base.
          fetch-depth: 0

      # Docs-only PRs (*.md, docs/, LICENSE) skip the app build below but
      # the job still succeeds, so the required `build` check stays green.
      # Pushes and tags always build: main merges re-verify the tree and
      # tags must produce release APKs.
      - name: Detect app changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- \
            | grep -v -e '\.md$' -e '^docs/' -e '^LICENSE$' -e '^THIRD_PARTY_LICENSES$' || true)
          if [ -z "$changed" ]; then
            echo "Docs-only change; skipping app build."
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

      # Supply chain: reject a tampered Gradle wrapper before running it.
      - name: Validate Gradle wrapper
        if: steps.filter.outputs.app == 'true'
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3

      - name: Set up JDK 17
        if: steps.filter.outputs.app == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.filter.outputs.app == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        if: steps.filter.outputs.app == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # v3 default (tools + platform-tools) breaks: the obsolete
          # `tools` package was removed from the SDK repo, so sdkmanager
          # exits 1 with "Failed to find package 'tools'". The runner
          # already ships platform-tools; Gradle fetches the rest.
          packages: ''

      - name: Set up debug keystore
        if: steps.filter.outputs.app == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android ~/.config/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.config/.android/debug.keystore
            cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.config/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
          fi

      # Fork PRs receive no secrets: detect signing ability once and let
      # every release-only step key off it, so forks stay green on the
      # debug-only path below. Upstream (and tags) always have secrets.
      - name: Detect release signing
        id: signing
        if: steps.filter.outputs.app == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "has-signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release secrets; building debug only."
            echo "has-signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up release keystore
        if: steps.filter.outputs.app == 'true' && steps.signing.outputs.has-signing == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          {
            echo "RELEASE_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      # Lint runs once, on the release variant: its source set is the one that
      # ships, it includes the Proguard checks `lintDebug` cannot see, and the
      # two variants analyse the same code. Running both cost ~55 s of a ~200 s
      # build. `assembleRelease` still runs lintVitalRelease on top of this.
      - name: Build, test, lint
        if: steps.filter.outputs.app == 'true' && steps.signing.outputs.has-signing == 'true'
        run: ./gradlew --no-daemon clean assembleDebug assembleRelease testDebugUnitTest koverVerifyDebug lintRelease

      # Unsigned fallback for forks: same checks minus assembleRelease,
      # which would fail at signing time without the release keystore.
      # lintRelease needs no keystore, so the plan's demand still holds.
      - name: Build, test, lint (debug only)
        if: steps.filter.outputs.app == 'true' && steps.signing.outputs.has-signing != 'true'
        run: ./gradlew --no-daemon clean assembleDebug testDebugUnitTest koverVerifyDebug lintRelease

      - name: Upload debug APK artifact
        if: steps.filter.outputs.app == 'true' && github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: singlenote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          # 343 of these piled up at the 90-day default (5.4 GiB with the tag
          # builds). A debug APK is reproducible from its commit, so it only
          # has to survive long enough to be downloaded.
          retention-days: 1
