name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the filter below diffs the PR against its base.
          fetch-depth: 0

      # Docs-only PRs (*.md, docs/, LICENSE) skip the app build below but
      # the job still succeeds, so the required `build` check stays green.
      # Pushes and tags always build: main merges re-verify the tree and
      # tags must produce release APKs.
      - name: Detect app changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- \
            | grep -v -e '\.md$' -e '^docs/' -e '^LICENSE$' || true)
          if [ -z "$changed" ]; then
            echo "Docs-only change; skipping app build."
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.filter.outputs.app == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        if: steps.filter.outputs.app == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        if: steps.filter.outputs.app == 'true'
        uses: android-actions/setup-android@v4
        with:
          # v3 default (tools + platform-tools) breaks: the obsolete
          # `tools` package was removed from the SDK repo, so sdkmanager
          # exits 1 with "Failed to find package 'tools'". The runner
          # already ships platform-tools; Gradle fetches the rest.
          packages: ''

      - name: Set up debug keystore
        if: steps.filter.outputs.app == 'true'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android ~/.config/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.config/.android/debug.keystore
            cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.config/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
          fi

      # Fork PRs receive no secrets: detect signing ability once and let
      # every release-only step key off it, so forks stay green on the
      # debug-only path below. Upstream (and tags) always have secrets.
      - name: Detect release signing
        id: signing
        if: steps.filter.outputs.app == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "has-signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release secrets; building debug only."
            echo "has-signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up release keystore
        if: steps.filter.outputs.app == 'true' && steps.signing.outputs.has-signing == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          {
            echo "RELEASE_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build, test, lint
        if: steps.filter.outputs.app == 'true' && steps.signing.outputs.has-signing == 'true'
        run: ./gradlew --no-daemon clean assembleDebug assembleRelease testDebugUnitTest lintDebug lintRelease

      # Unsigned fallback for forks: same checks minus assembleRelease,
      # which would fail at signing time without the release keystore.
      # lintRelease needs no keystore, so the plan's demand still holds.
      - name: Build, test, lint (debug only)
        if: steps.filter.outputs.app == 'true' && steps.signing.outputs.has-signing != 'true'
        run: ./gradlew --no-daemon clean assembleDebug testDebugUnitTest lintDebug lintRelease

      - name: Upload debug APK artifact
        if: steps.filter.outputs.app == 'true' && github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: singlenote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Tag builds hand versioned APKs + checksums to the release
      # publishing below. Gated on signing: fork tags build debug-only,
      # so there is no signed release APK to name — skip, stay green.
      - name: Name APKs for release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.has-signing == 'true'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "singlenote-${{ github.ref_name }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "singlenote-${{ github.ref_name }}-release.apk"
          sha256sum "singlenote-${{ github.ref_name }}-debug.apk" > "singlenote-${{ github.ref_name }}-debug.apk.sha256"
          sha256sum "singlenote-${{ github.ref_name }}-release.apk" > "singlenote-${{ github.ref_name }}-release.apk.sha256"
          # v1.0.0 plan: log the release hash in the workflow output.
          sha256sum "singlenote-${{ github.ref_name }}-debug.apk" "singlenote-${{ github.ref_name }}-release.apk"

      - name: Release APKs on tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.has-signing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Versioned names (e.g. singlenote-v0.3.3-release.apk) so assets
          # are identifiable without opening the release; the .sha256
          # files let sideloaders verify with `sha256sum -c`.
          files: |
            singlenote-${{ github.ref_name }}-debug.apk
            singlenote-${{ github.ref_name }}-debug.apk.sha256
            singlenote-${{ github.ref_name }}-release.apk
            singlenote-${{ github.ref_name }}-release.apk.sha256
          generate_release_notes: true
