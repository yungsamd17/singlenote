name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag (vX.Y.Z) on main'
        required: true
        type: string

# Publishing runs are never cancelled by another release.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Least privilege by default: the `build` job only reads the repo.
# The tag-only `release` job below escalates to `contents: write` —
# the minimum softprops/action-gh-release needs to create the GitHub
# Release and upload assets (plus attestations/id-token for build
# provenance). Keeping write off the build job limits what a compromised
# build step could do.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      # Publication is gated on the signed build.
      has-signing: ${{ steps.signing.outputs.has-signing }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history is needed to verify main ancestry.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Validate release tag and version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PYTHON'
          import os, re
          text = open('app/build.gradle.kts').read()
          version = re.search(r'versionName = "([^"]+)"', text).group(1)
          assert os.environ['RELEASE_TAG'] == 'v' + version, 'Tag must match versionName'
          PYTHON

      # Supply chain: reject a tampered Gradle wrapper before running it.
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # v3 default (tools + platform-tools) breaks: the obsolete
          # `tools` package was removed from the SDK repo, so sdkmanager
          # exits 1 with "Failed to find package 'tools'". The runner
          # already ships platform-tools; Gradle fetches the rest.
          packages: ''

      - name: Set up debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android ~/.config/.android
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.config/.android/debug.keystore
            cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.config/.android/debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.config/.android/debug.keystore ~/.android/debug.keystore
          fi

      # Fork PRs receive no secrets: detect signing ability once and let
      # every release-only step key off it, so forks stay green on the
      # debug-only path below. Upstream (and tags) always have secrets.
      - name: Detect release signing
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "has-signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets are missing."
            echo "has-signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up release keystore
        if: steps.signing.outputs.has-signing == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          {
            echo "RELEASE_KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore"
            echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Require release signing
        if: steps.signing.outputs.has-signing != 'true'
        run: |
          echo "Release signing secrets are required."
          exit 1

      - name: Build, test, lint
        if: steps.signing.outputs.has-signing == 'true'
        run: ./gradlew --no-daemon clean assembleDebug assembleRelease testDebugUnitTest lintDebug lintRelease

      # No checksum files: releases ship exactly debug + release APKs.
      - name: Name APKs for release job
        if: steps.signing.outputs.has-signing == 'true'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "singlenote-${{ inputs.tag || github.ref_name }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "singlenote-${{ inputs.tag || github.ref_name }}-release.apk"
          # v1.0.0 plan: log the release hash in the workflow output.
          sha256sum "singlenote-${{ inputs.tag || github.ref_name }}-debug.apk" "singlenote-${{ inputs.tag || github.ref_name }}-release.apk"

      - name: Upload APKs for release job
        if: steps.signing.outputs.has-signing == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: singlenote-apks
          path: |
            singlenote-${{ inputs.tag || github.ref_name }}-debug.apk
            singlenote-${{ inputs.tag || github.ref_name }}-release.apk
          # Hand-off to the `release` job below, which downloads this within
          # the same run and attaches it to the GitHub Release. The Release
          # is the durable copy; this needs to outlive the download and
          # nothing more.
          retention-days: 1

  release:
    # Publish only after the signed build and all checks pass.
    if: needs.build.outputs.has-signing == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Minimum for softprops/action-gh-release: create the Release and
      # upload assets. attestations/id-token feed build provenance below.
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Download APKs from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: singlenote-apks
          path: dist

      # Sideloaded APKs get Sigstore build provenance, verifiable from
      # the release page. Runs here (not on forks) so it can't break them.
      - name: Attest APK provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/singlenote-${{ inputs.tag || github.ref_name }}-debug.apk
            dist/singlenote-${{ inputs.tag || github.ref_name }}-release.apk

      - name: Release APKs on tag
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Versioned names (e.g. singlenote-v0.3.3-release.apk) so assets
          # are identifiable without opening the release. Exactly two
          # assets, nothing else: debug + release APKs, no checksums.
          files: |
            dist/singlenote-${{ inputs.tag || github.ref_name }}-debug.apk
            dist/singlenote-${{ inputs.tag || github.ref_name }}-release.apk
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
