name: Diag

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Env before
        run: |
          echo "HOME=$HOME"
          env | grep -iE 'ANDROID|HOME' | sort

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Env after
        run: env | grep -iE 'ANDROID|HOME' | sort

      - name: Decode secret keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          echo "secret length: ${#DEBUG_KEYSTORE_BASE64}"
          mkdir -p ~/.android
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          echo "file sha256:"
          sha256sum ~/.android/debug.keystore
          echo "keystore cert fingerprint:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android 2>/dev/null | grep -E 'Alias|SHA256: ' | head -4

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Where did keystores end up?
        run: |
          echo "--- all debug.keystore files on runner:"
          find / -name 'debug.keystore' 2>/dev/null | while read -r f; do sha256sum "$f"; done
          echo "--- cert actually in built APK:"
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -E 'SHA-256' | head -2
