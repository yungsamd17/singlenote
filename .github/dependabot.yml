version: 2
updates:
  # Weekly automation keeps updates small and reviewable. Major jumps
  # that move in lockstep (Kotlin/KSP/AGP) still land as deliberate
  # follow-ups, not blind bump merges.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
