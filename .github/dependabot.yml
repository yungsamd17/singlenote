version: 2
updates:
  # Dependencies are ~9 months stale (Kotlin 2.1.0, AGP 8.7.3, BOM
  # 2024.12.01), but the 2.1→2.2 + AGP 8→9 jump breaks KSP all at once —
  # that bump stays a deliberate follow-up. This automation keeps future
  # updates small and reviewable instead.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
